// استاندارد فلاتر: لودر پلاگین، پلاگین گرادل فلاتر را از SDK پیدا می‌کند.
pluginManagement {
    // مسیر SDK فلاتر از local.properties خوانده می‌شود تا لودر پلاگین فلاتر
    // مستقیم از داخل SDK لود شود (بدون نیاز به دانلود از اینترنت).
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null, "flutter.sdk not set in local.properties"
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'english_teacher'
include ':app'
